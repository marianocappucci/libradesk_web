services:
  web:
    build: .
    image: libradesk-web:latest
    container_name: libradesk-web
    restart: unless-stopped
    environment:
      - AUTH_UPSTREAM=libradesk-web-auth
    ports:
      - "8088:80"
    networks:
      - stack-net
    depends_on:
      - auth

  auth:
    build:
      context: ./auth
      ssh:
        - default=${LIBRA_WEB_KIT_SSH_KEY:-~/.ssh/id_ed25519_libra_web_kit}
    image: libradesk-web-auth:latest
    container_name: libradesk-web-auth
    restart: unless-stopped
    environment:
      - DOCS_AUTH_SECRET=${DOCS_AUTH_SECRET:-}
      - DOCS_SESSION_SECRET=${DOCS_SESSION_SECRET:-libradesk-docs-secret-change-me}
      - APEX_DOMAIN=${APEX_DOMAIN:-libradesk.com.ar}
    networks:
      - stack-net

networks:
  stack-net:
    external: true
    name: stack_stack-net
